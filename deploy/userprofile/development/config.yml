http_server:
  host: ""
  port: 8081
  shutdown_context_timeout: 10s

rpc_server:
  host: ""
  port: 8091
  network_type: "tcp"
  allow_insecure: true

leaderboardstat_grpc_client:
  dial_timeout: 2s
  host: "leaderboardstat-app"
  port: 8091
  grpc_service_name: "leaderboardstat.LeaderboardStatService"
  max_attempts: 3
  initial_backoff: 500ms
  max_backoff: 1s
  backoff_multiplier: 1.5
  retryable_status_codes:
    - "UNAVAILABLE"
    - "DEADLINE_EXCEEDED"

contributor_grpc_client:
  dial_timeout: 2s
  host: "contributor-app"
  port: 8093
  grpc_service_name: "contributor.v1.ContributorService"
  max_attempts: 3
  initial_backoff: 500ms
  max_backoff: 1s
  backoff_multiplier: 1.5
  retryable_status_codes:
    - "UNAVAILABLE"
    - "DEADLINE_EXCEEDED"

scheduler_cfg:
  snapshot_crontab: "0 */3 * * *"
  snapshot_job_context_timeout: 15m



redis:
  host: "shared-redis"
  port: 6379
  password: ""
  db: 0


logger:
  level: "debug" # Can be `debug`, `info`, `warn`, `error`
  file_path: "logs/userprofileapp/service.log"
  use_local_time: true
  file_max_size_in_mb: 10
  file_max_age_in_days: 7

raw_event_consumer:
  processed_key_ttl: 24h
  lock_key_ttl: 5m
  prefix_processed_key: "processed_events"
  prefix_lock_key: "lock"

nats_adapter:
  url: "nats://shared-nats:4222"
  max_reconnects: -1
  reconnect_wait: 1s

  # Stream settings
  max_messages: 10000000
  max_bytes: 10737418240
  max_age: 24h
  storage_type: "memory" # "memory" → RAM
  replicas: 1
  retention_policy: "workqueue"

pull_consumer:
  durable_name: "batch-processor"
  batch_size: 500
  max_wait: 5s
  max_deliver: 20
  ack_wait: 1m

batch_processor:
  tick_interval: 10s
  metrics_interval: 30s

total_shutdown_timeout: 30m

service:
  upstream_time_out: 5s
