services:
  realtime-app:
    image: rankr-go-dev:${GO_IMAGE_VERSION:-${DEFAULT_GO_IMAGE_VERSION:-1.25-alpine}}
    build:
      context: ../../..
      dockerfile: ./deploy/development/Dockerfile
      args:
        GO_IMAGE_NAME: ${GO_IMAGE_NAME:-${DEFAULT_GO_IMAGE_NAME:-golang}}
        GO_IMAGE_VERSION: ${GO_IMAGE_VERSION:-${DEFAULT_GO_IMAGE_VERSION:-1.25-alpine}}
        AIR_VERSION: ${AIR_VERSION:-${DEFAULT_AIR_VERSION:-v1.66.1}}
    container_name: realtime-app
    volumes:
      - ../../..:/app
    networks:
      - rankr-shared-development-network
    environment:
      - CONFIG_PATH=/app/deploy/realtime/development/config.yml
      - realtime_POSTGRES_DB_HOST=shared-postgres
      - realtime_POSTGRES_DB_USER=realtime_user
      - realtime_POSTGRES_DB_PASSWORD=change_me_realtime
      - realtime_POSTGRES_DB_NAME=realtime_db
      - realtime_POSTGRES_DB_PORT=5432
      - realtime_REDIS_HOST=shared-redis
      - realtime_NATS_URL=nats://shared-nats:4222
    entrypoint: [ "air", "-c", "/app/.air/.air.realtime.toml" ]

networks:
  rankr-shared-development-network:
    external: true
