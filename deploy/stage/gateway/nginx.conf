# Stage gateway (OpenResty). Listens on :80 inside the container; the compose
# file publishes it on 127.0.0.1 only and the host nginx terminates TLS.
#
# Public (no bearer token, TD-04 / #221):
#   /health/<service>          health checks of the six v1 services
#   /github-webhook/*          GitHub deliveries (signature check is TD-08 / #224)
#   GET /v1/leaderboard/public/*
#   /auth/*                    login and refresh-token (auth skips its own check)
# Everything else under /v1 goes through auth_request.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Docker DNS, so upstreams resolve after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 5m;

    server {
        listen 80 default_server;
        server_name _;

        error_page 401 403 = @auth_unauthorized;

        set $auth_upstream "auth-app:8081";
        set $contributor_upstream "contributor-app:8082";
        set $leaderboardscoring_upstream "leaderboardscoring-app:8081";
        set $leaderboardstat_upstream "leaderboardstat-app:8081";
        set $project_upstream "project-app:8084";
        set $webhook_upstream "webhook-app:8090";

        location @auth_unauthorized {
            default_type application/json;
            return 401 '{"error":"unauthorized"}';
        }

        location = /auth_verify {
            internal;
            proxy_method GET;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_pass http://$auth_upstream/v1/me;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-Host $host;
        }

        # ---------------------------------------------------- health checks
        location = /health/auth {
            proxy_pass http://$auth_upstream/v1/health-check;
            include proxy_headers.conf;
        }

        location = /health/contributor {
            proxy_pass http://$contributor_upstream/v1/health-check;
            include proxy_headers.conf;
        }

        location = /health/leaderboardscoring {
            proxy_pass http://$leaderboardscoring_upstream/v1/health-check;
            include proxy_headers.conf;
        }

        location = /health/leaderboardstat {
            proxy_pass http://$leaderboardstat_upstream/v1/health-check;
            include proxy_headers.conf;
        }

        location = /health/project {
            proxy_pass http://$project_upstream/v1/health-check;
            include proxy_headers.conf;
        }

        location = /health/webhook {
            proxy_pass http://$webhook_upstream/github-webhook/health-check;
            include proxy_headers.conf;
        }

        # ---------------------------------------------------- public routes
        location ^~ /github-webhook/ {
            proxy_pass http://$webhook_upstream;
            include proxy_headers.conf;
        }

        location ^~ /v1/leaderboard/public/ {
            proxy_pass http://$leaderboardstat_upstream;
            include proxy_headers.conf;
        }

        location /auth/ {
            rewrite ^/auth/?(.*)$ /$1 break;
            proxy_pass http://$auth_upstream;
            include proxy_headers.conf;
        }

        # --------------------------------------------- authenticated routes
        location ~ ^/v1/(projects|vcs-repos)(/|$) {
            proxy_pass http://$project_upstream;
            include auth_headers.conf;
        }

        location ~ ^/v1/(profile|create|update|jobs|password)(/|$) {
            proxy_pass http://$contributor_upstream;
            include auth_headers.conf;
        }

        location ~ ^/v1/contributors(/|$) {
            proxy_pass http://$leaderboardstat_upstream;
            include auth_headers.conf;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"route_not_found"}';
        }
    }
}
