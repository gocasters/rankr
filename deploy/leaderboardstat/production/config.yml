http_server:
  host: ""
  port: 8081
  shutdown_context_timeout: 10s

rpc_server:
  host: ""
  port: 8091
  network_type: "tcp"
  allow_insecure: true

grpc_client:
  contributor:
    address: "contributor-app:8093"
    grpc_service_name: "contributor"
    timeout: 30s
    max_retries: 3
    retry_backoff: 100ms
  
  leaderboardscoring:
    address: "leaderboardscoring-app:8091"
    grpc_service_name: "leaderboardscoring"
    timeout: 30s
    max_retries: 3
    retry_backoff: 100ms

leaderboard_scoring_rpc:
  host: "leaderboardscoring-app"
  port: 8070
  grpc_service_name: "leaderboardscoring.v1.LeaderboardScoringService"
  max_attempts: 3
  initial_backoff: 30s
  max_backoff: 50s
  backoff_multiplier: 1.5
  retryable_status_codes:
    - "UNAVAILABLE"
    - "DEADLINE_EXCEEDED"

project_rpc:
  host: "project-app"
  port: 8094
  grpc_service_name: "project.v1.ProjectService"
  max_attempts: 3
  initial_backoff: 30s
  max_backoff: 50s
  backoff_multiplier: 1.5
  retryable_status_codes:
    - "UNAVAILABLE"
    - "DEADLINE_EXCEEDED"

# Crons, documented in docs/leaderboardstat-crons.md. Five-field crontabs,
# local time zone. Override with STAT_SCHEDULER_CFG__<KEY>, e.g.
# STAT_SCHEDULER_CFG__PUBLIC_LEADERBOARD_CRON. A missing key falls back to
# the code default in leaderboardstatapp/delivery/scheduler/scheduler.go.
scheduler_cfg:
  # job "public-leaderboard-update": rebuilds the Redis public leaderboard
  # (3m TTL) served by GET /v1/leaderboard/public/:project_id.
  # Every minute. Code default: "*/3 * * * *".
  public_leaderboard_cron: "* * * * *"
  # Max duration of one run of either job. Code default: 3m.
  job_context_timeout: "1m"
  # job "daily-score-calculation": stores today's scores in Postgres for
  # GET /v1/contributors/:id/stats. "daily" is the data window, not the rate.
  # Every 10 minutes. Code default: "0 2 * * *" (daily at 02:00).
  daily_score_calculation_cron: "*/10 * * * *"

redis:
  host: "shared-redis"
  port: 6379
  password: ""
  db: 0

watermill_nats:
  url: "nats://shared-nats:4222"
  client_id: "leaderboardstat"
  durable_name: "leaderboardstat-consumer"
  queue_group: "event-group"

  ack_wait_timeout: 5m
  max_inflight: 10
  connect_timeout: 30s
  reconnect_wait: 5s
  ping_interval: 30s
  max_pings_out: 1

  use_jetstream: true

logger:
  level: "debug" # Can be `debug`, `info`, `warn`, `error`
  file_path: "logs/leaderboardstatapp/service.log"
  use_local_time: true
  file_max_size_in_mb: 10
  file_max_age_in_days: 7

raw_event_consumer:
  processed_key_ttl: 24h
  lock_key_ttl: 5m
  prefix_processed_key: "processed_events"
  prefix_lock_key: "lock"

database_retry:
  max_retries: 3
  retry_delay: 100ms

nats_adapter:
  url: "nats://shared-nats:4222"
  max_reconnects: -1
  reconnect_wait: 1s

  # Stream settings
  max_messages: 10000000
  max_bytes: 10737418240
  max_age: 24h
  storage_type: "memory" # "memory" → RAM
  replicas: 1
  retention_policy: "workqueue"

pull_consumer:
  durable_name: "batch-processor"
  batch_size: 500
  max_wait: 5s
  max_deliver: 20
  ack_wait: 1m

batch_processor:
  tick_interval: 10s
  metrics_interval: 30s

total_shutdown_timeout: 30m

path_of_migration: "./leaderboardstatapp/repository/migrations"

postgres_db:
  host: shared-postgres
  port: 5432
  user: leaderboardstat_user
  password: change_me_stat
  db_name: leaderboardstat_db
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 300
  max_conn_idle_time: 60
  health_check_period: 60
