services:
  task-app:
    image: rankr-go-dev:${GO_IMAGE_VERSION:-${DEFAULT_GO_IMAGE_VERSION:-1.25.3-alpine}}
    build:
      context: ../../..
      dockerfile: ./deploy/development/Dockerfile
      args:
        GO_IMAGE_NAME: ${GO_IMAGE_NAME:-${DEFAULT_GO_IMAGE_NAME:-golang}}
        GO_IMAGE_VERSION: ${GO_IMAGE_VERSION:-${DEFAULT_GO_IMAGE_VERSION:-1.25.3-alpine}}
        AIR_VERSION: ${AIR_VERSION:-${DEFAULT_AIR_VERSION:-v1.66.1}}
    container_name: task-app
    volumes:
      - ../../..:/app
      - rankr-go-build-cache:/root/.cache/go-build
    networks:
      - rankr-shared-development-network
    environment:
      - CONFIG_PATH=/app/deploy/task/development/config.yml
      - task_POSTGRES_DB_HOST=${TASK_DB_HOST:-shared-postgres}
      - task_POSTGRES_DB_USER=${TASK_DB_USER}
      - task_POSTGRES_DB_PASSWORD=${TASK_DB_PASSWORD}
      - task_POSTGRES_DB_NAME=${TASK_DB_NAME}
      - task_POSTGRES_DB_PORT=${TASK_DB_PORT:-5432}
      - task_REDIS_HOST=shared-redis
      - task_NATS_URL=nats://shared-nats:4222
    entrypoint: [ "air", "-c", "/app/.air/.air.task.toml" ]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health-check > /dev/null"]
      interval: 8s
      timeout: 3s
      retries: 5
      start_period: 8s

volumes:
  rankr-go-build-cache:
    name: rankr-go-build-cache

networks:
  rankr-shared-development-network:
    external: true
