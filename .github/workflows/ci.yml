name: CI RANKR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  
env:
  BUF_VERSION: ${{ vars.BUF_VERSION || 'v1.56.0' }}
  GITLEAKS_VERSION: ${{ vars.GITLEAKS_VERSION || 'v8.30.1' }}
  GOVULNCHECK_VERSION: ${{ vars.GOVULNCHECK_VERSION || 'v1.1.4' }}
  GOLANGCI_LINT_VERSION: ${{ vars.GOLANGCI_LINT_VERSION || 'v2.4.0' }}

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go mod tidy & download
        run: |
          go mod tidy
          go mod download

      - name: Setup Buf
        uses: ./.github/actions/setup-buf

      - uses: actions/cache@v6
        id: cache-go-tools
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GITLEAKS_VERSION }}-${{ env.GOVULNCHECK_VERSION }}

      - name: Installing CI check dependencies
        run: |
          command -v golangci-lint || make install-linter GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}
          command -v gitleaks || make install-gitleaks GITLEAKS_VERSION=${{ env.GITLEAKS_VERSION }}
          command -v govulncheck || make install-govulncheck GOVULNCHECK_VERSION=${{ env.GOVULNCHECK_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Running CI checks
        env:
          DEFAULT_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
        run: make ci
