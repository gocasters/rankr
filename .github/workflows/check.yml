name: check

on:
  pull_request:
    branches: [main]

# Repo variable BUF_VERSION overrides; else Makefile default (v1.56.0). Make uses ?=.
env:
  BUF_VERSION: ${{ vars.BUF_VERSION || 'v1.56.0' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make check (changed packages)
        run: make check BASE=origin/${{ github.base_ref }}

  # Issue #268: fail the PR if a .proto change would break existing clients.
  proto-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: ./.github/actions/setup-buf

      - name: check protobuf for breaking changes
        run: make proto-breaking DEFAULT_BRANCH=${{ github.base_ref }}
